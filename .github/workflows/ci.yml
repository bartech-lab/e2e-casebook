name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose up --build --wait
      - name: API answers and test hooks are mounted
        run: |
          curl -sf http://localhost:3000/api/health
          id=$(curl -sf -X POST http://localhost:3000/api/sandboxes | jq -r .id)
          curl -sf -X POST "http://localhost:3000/__test__/s/$id/reset"
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
      - if: failure()
        run: docker compose logs
